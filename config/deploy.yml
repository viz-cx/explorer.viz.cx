# Kamal deploy config for the viz.cx API — single FastAPI container (uvicorn
# :8000) with the parser worker thread inside (raw-block ingest; it also emits
# the live op stream for tip blocks to /ws/ops + webhooks). API-only deploy: the
# legacy box (138.201.117.201) keeps serving the viz.cx site frontend; this app
# serves api.viz.cx and reverse-proxies node.viz.cx (HTTP + WS) to the live RPC
# node at https://rpc.viz.cx (FastAPI middleware + ws route in
# api/main.py — kamal-proxy issues/renews the cert because the host is listed
# here; node.viz.cx does NOT go into infra's tls-hosts.txt, proxy-only hosts
# never do).
#
# Data: shared platform MongoDB, db `viz-cx-api` (the legacy 15.2 GB
# `viz-blockchain` db restored with ns remap — infra runbook-viz-migration §10).
# Raw blocks live in `blocks` (renamed from the legacy `blocks4`). The derived
# `ops`/`rollups`/`posts` collections were dropped — the API is raw-blocks-only;
# anything derived is recomputed from `blocks` or read off-chain by the frontend.
# Chain feed: the public VIZ RPC node (rpc.viz.cx, on martin since 2026-07-27 —
# it moved off the now-dead vpn-amnezia box). The app calls mongo AND the node
# during boot (lifespan: init_node + ensure_indexes), so it relies on
# platform-up.sh's mongo bridge onto the kamal network — hostname `mongo`
# resolves at container boot; the post-deploy hook adds platform_net after.

service: viz-cx-api
image:   chiliec/viz-cx-api        # GHCR: composed to ghcr.io/chiliec/viz-cx-api via registry.server

servers:
  web:
    hosts:
      - 5.223.75.86               # axveer VPS public IPv4

ssh:
  user: deploy
  port: 666                       # hardened sshd per infra inventory.yml

proxy:
  hosts:
    - api.viz.cx                  # the API's own name (A record → axveer)
    - node.viz.cx                 # legacy RPC name — reverse-proxied (HTTP+WS)
  app_port: 8000
  ssl: true
  healthcheck:
    path: /                       # others.py home() — node info round-trip;
                                  # only polled during deploy. Fail-closed: the
                                  # lifespan already hard-fails boot if the VIZ
                                  # node or mongo is unreachable.

registry:
  server: ghcr.io
  username: chiliec
  password:
    - KAMAL_REGISTRY_PASSWORD     # GHCR PAT (write:packages) — SOPS shared.enc.yaml docker_registry_password

env:
  clear:
    DB_NAME: viz-cx-api           # restored from legacy `viz-blockchain` (ns remap)
    COLLECTION: blocks            # raw blocks (renamed from legacy `blocks4`)
    # COLLECTION_WEBHOOKS uses the code default (webhooks). The ops/rollups/posts
    # collections and their COLLECTION_OPS/COLLECTION_POSTS knobs are gone.
    VIZ_NODES: https://rpc.viz.cx,https://api.viz.world
    # Parser floor — re-jumped to the chain tip on 2026-06-29 after the index
    # froze at 80,807,024 (2026-06-15): the parser fell out of rpc.viz.cx's short
    # get_ops_in_block window, so the next block returned [] forever (fixed in
    # commit 388ca8e — empty blocks now advance instead of crash-looping).
    # Known unfillable holes (no reachable node serves the ops):
    #   79,105,831–80,679,604  (legacy vizd wedged; see commit 1f6663f)
    #   80,807,025–~81,193,000  (this freeze; out of every node's tip window)
    PARSER_START_BLOCK: "81193000"
    # Only the parser worker exists now (feeds raw blocks into mongo and emits
    # tip ops live). The sorter/posts workers were removed, along with their
    # SKIP_SORTER/SKIP_POSTS knobs. SKIP_WORKERS=1 (unset here) would skip the
    # parser — used only by tests. See api/main.py _start_background_workers.
    # EMIT_TIP_LAG bounds how close to the chain tip a block must be to emit
    # live (default 5); set explicitly here for clarity.
    EMIT_TIP_LAG: "5"
    LOG_LEVEL: INFO
    # ROOT_PATH unset on purpose: kamal drops empty-string env values, so the
    # "" default lives in api/main.py. Set it only under a stripped prefix.
  secret:                         # decrypted from SOPS via .kamal/secrets
    - MONGO                       # full mongodb:// URI incl. app-user creds

builder:
  arch: amd64
  remote: ssh://axveer-builder   # native amd64 build on martin, not the laptop. Bare
  local: false                   # user/port fall back to ssh: above (deploy/666) +
                                 # ~/.ssh/config axveer-builder host. See infra
                                 # docs/runbook-remote-builder.md.
  context: api                    # build context = api/ (kamal chdirs to the
  dockerfile: api/Dockerfile      # git clone root; both paths resolve from there)
